<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #c9d1d9; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .arrow-green { stroke: #3fb950; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#0d1117" rx="12" />
  <rect x="1" y="1" width="798" height="478" fill="none" stroke="#30363d" stroke-width="1.5" rx="12" />

  <text x="400" y="38" text-anchor="middle" class="title" style="font-size: 18px; fill: #58a6ff;">SISTEMA DE MEMORIA PERSISTENTE Y REGLAS LOCALES</text>
  <text x="400" y="58" text-anchor="middle" class="subtitle">Acelera la exploración mediante indexación y garantiza respeto de convenciones de equipo</text>

  <!-- Storage Left Column -->
  <g filter="url(#shadow)">
    <!-- .devbotrules Box -->
    <rect x="40" y="90" width="280" height="150" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.5" />
    <text x="60" y="118" class="title" style="fill: #d2a8ff; font-size: 15px;">📜 .devbotrules / devbot.json</text>
    <text x="60" y="138" class="subtitle">Directrices y Políticas de Equipo</text>
    <text x="60" y="165" class="desc">• Estilo de código y convenciones.</text>
    <text x="60" y="185" class="desc">• Restricciones de arquitectura (DDD, Hexagonal).</text>
    <text x="60" y="205" class="desc">• Librerías prohibidas o recomendadas.</text>
    <text x="60" y="225" class="desc">• Directrices de logging y testing.</text>
  </g>

  <g filter="url(#shadow)">
    <!-- .devbot/repo_map.json Box -->
    <rect x="40" y="270" width="280" height="175" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" />
    <text x="60" y="298" class="title" style="fill: #58a6ff; font-size: 15px;">🗺️ .devbot/repo_map.json</text>
    <text x="60" y="318" class="subtitle">Mapa Arquitectónico Indexado</text>
    <text x="60" y="345" class="desc">• LastCommitHash (validación de caché).</text>
    <text x="60" y="365" class="desc">• Entrypoints: Program.cs, index.ts, etc.</text>
    <text x="60" y="385" class="desc">• MainLayers: API, Business, Data, Tests.</text>
    <text x="60" y="405" class="desc">• Components: Mapeo de directorios y tipos.</text>
    <text x="60" y="425" class="desc">• Evita re-escanear en cada ejecución.</text>
  </g>

  <!-- Middle Service: RepositoryMemoryService -->
  <rect x="360" y="190" width="160" height="110" rx="8" fill="#0c2d6b" stroke="#388bfd" stroke-width="2" filter="url(#shadow)" />
  <text x="440" y="225" text-anchor="middle" class="title" style="font-size: 13px;">RepositoryMemory</text>
  <text x="440" y="245" text-anchor="middle" class="title" style="font-size: 13px;">Service</text>
  <text x="440" y="270" text-anchor="middle" class="subtitle">Carga, Genera y</text>
  <text x="440" y="285" text-anchor="middle" class="subtitle">Actualiza Memoria</text>

  <!-- Arrows from Left to Service -->
  <path d="M 320 165 L 360 215" class="arrow" marker-end="url(#arrow-b)" />
  <path d="M 320 355 L 360 275" class="arrow" marker-end="url(#arrow-b)" />

  <!-- Right Column: Subagents Consumers -->
  <g filter="url(#shadow)">
    <!-- Scout Agent Box -->
    <rect x="560" y="100" width="200" height="100" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <text x="660" y="130" text-anchor="middle" class="title" style="fill: #79c0ff; font-size: 14px;">🔍 Scout Agent</text>
    <text x="660" y="152" text-anchor="middle" class="subtitle">Recibe en Prompt:</text>
    <text x="660" y="172" text-anchor="middle" class="desc">• Reglas locales</text>
    <text x="660" y="188" text-anchor="middle" class="desc">• Mapa de arquitectura</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Coder Agent Box -->
    <rect x="560" y="240" width="200" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5" />
    <text x="660" y="270" text-anchor="middle" class="title" style="fill: #ffa657; font-size: 14px;">🔨 Coder Agent</text>
    <text x="660" y="292" text-anchor="middle" class="subtitle">Recibe en Prompt:</text>
    <text x="660" y="312" text-anchor="middle" class="desc">• Reglas locales (.devbotrules)</text>
  </g>

  <!-- Arrows from Service to Right -->
  <path d="M 520 225 L 560 160" class="arrow" marker-end="url(#arrow-b)" />
  <path d="M 520 265 L 560 275" class="arrow" marker-end="url(#arrow-b)" />

  <!-- Feedback Loop: Git Commit to repo_map.json -->
  <path d="M 660 330 L 660 410 L 320 410" class="arrow-green" stroke-dasharray="4,4" marker-end="url(#arrow-g)" />
  <text x="500" y="402" text-anchor="middle" class="subtitle" style="fill: #3fb950; font-weight: 600;">Post-Commit: Actualiza LastCommitHash en .devbot/repo_map.json</text>

</svg>
